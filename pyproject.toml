[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnki-literature-mcp"
version = "0.2.0"
description = "Local, permission-aware CNKI literature research MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "playwright>=1.50,<2",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
  "bibtexparser>=1.4,<2",
  "rispy>=0.9,<1",
]

[project.scripts]
cnki-mcp = "cnki_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/cnki_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: requires installed Playwright Chromium headless shell; synthetic pages only"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
