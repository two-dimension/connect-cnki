name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-tests:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: npm ci --prefix src/cnki_mcp/js
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q -m "not browser"
      - run: uv run python scripts/validate_review_protocol.py
      - run: uv build
      - run: uv run python scripts/validate_distribution.py --install
      - run: uv run python scripts/validate_upgrade.py
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
  browser-fixtures:
    runs-on: windows-latest
    env:
      CNKI_TEST_BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest -q -m browser
